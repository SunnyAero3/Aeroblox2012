<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroBLOX - Login</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">

    <!-- Guard: Redirect to dashboard if already logged in -->
    <script>
        if (localStorage.getItem("aeroUser")) {
            window.location.href = "index.html";
        }
    </script>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container">
        
        <!-- Primary Main Navigation Bar -->
        <div class="top-nav">
            <h1>AeroBLOX</h1>
            <div class="nav-links">
                <a href="login.html">My AeroBLOX</a> | 
                <a href="#">Games</a> | 
                <a href="#">Catalog</a> | 
                <a href="people.html">People</a> | 
                <a href="#">Forum</a>
            </div>
        </div>
        
        <!-- Login Module -->
        <div class="module-box" style="width: 400px; margin: 40px auto;">
            <div class="module-header">Member Login</div>
            <div class="module-content" style="background: #fff; padding: 20px;">
                
                <div id="auth-forms">
                    <div style="margin-bottom: 12px;">
                        <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">Username:</label>
                        <input type="text" id="username-input" style="width: 95%; padding: 6px; border: 1px solid #7f9db9;">
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">Password:</label>
                        <input type="password" id="password-input" style="width: 95%; padding: 6px; border: 1px solid #7f9db9;">
                    </div>
                    
                    <button id="login-btn" class="btn-classic" onclick="loginUser()">Login</button>
                    <button id="register-btn" class="btn-classic" onclick="registerUser()">Register</button>
                </div>

                <!-- Status Message -->
                <p id="status-message" style="font-size: 12px; font-weight: bold; margin-top: 15px; text-align: center; color: red;"></p>
                
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
