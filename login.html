<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroBLOX - Login / Register</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase CDN MUST load before auth.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container" style="max-width: 500px; margin-top: 40px;">
        
        <!-- Header Bar -->
        <div class="top-header-bar" style="text-align: center; padding: 6px; background: #f2f2f2; border-bottom: 1px solid #ccc; font-size: 12px; font-weight: bold; color: #003366;">
            Welcome to AeroBLOX
        </div>

        <!-- Centered Header -->
        <div class="top-nav" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px 0 12px 0; background: linear-gradient(to bottom, #004080, #002b55); color: #fff;">
            <h1 style="margin: 0; font-size: 28px;">AeroBLOX</h1>
            <span style="font-size: 11px; color: #b3d1ff;">2012 Retro Revival Sandbox</span>
        </div>

        <!-- Main Form Container -->
        <div style="padding: 20px;">
            <div class="module-box" style="border: 1px solid #a6a6a6; background: #fff;">
                <div class="module-header" style="background: linear-gradient(to bottom, #4c5d73, #2d3846); color: #fff; padding: 6px 10px; font-weight: bold;">
                    Account Authentication
                </div>
                <div class="module-content" style="padding: 20px;">
                    
                    <form id="auth-form" onsubmit="handleAuth(event)" style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label style="display: block; font-weight: bold; margin-bottom: 4px; font-size: 11px;">Username:</label>
                            <input type="text" id="auth-username" required style="width: 100%; padding: 6px; border: 1px solid #888; border-radius: 3px;">
                        </div>

                        <div>
                            <label style="display: block; font-weight: bold; margin-bottom: 4px; font-size: 11px;">Password:</label>
                            <input type="password" id="auth-password" required style="width: 100%; padding: 6px; border: 1px solid #888; border-radius: 3px;">
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button type="submit" class="btn-classic" style="flex: 1; padding: 6px; font-weight: bold; background: linear-gradient(to bottom, #ffffff, #e6e6e6);">Login</button>
                            <button type="button" class="btn-classic" style="flex: 1; padding: 6px; font-weight: bold; background: linear-gradient(to bottom, #e8f4f8, #cce5ff);" onclick="handleRegister()">Register</button>
                        </div>
                    </form>

                    <p id="auth-error-msg" style="color: #d9534f; font-size: 11px; text-align: center; margin: 12px 0 0 0; display: none;"></p>

                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
