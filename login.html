<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBLOX - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-nav">
        <h1>AeroBLOX</h1>
        <div class="nav-links">
            <a href="index.html">Home</a> | 
            <a href="games.html">Games</a> | 
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="main-container login-container">
        <h2>Login to your account</h2>
        <div class="login-box">
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn" class="btn-aero">Login</button>
        </div>

        <hr>

        <h2>New here? Sign up!</h2>
        <div class="signup-box">
            <input type="text" id="signup-username" placeholder="Choose a Username">
            <input type="password" id="signup-password" placeholder="Create a Password">
            <button id="signup-btn" class="btn-aero">Sign Up</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 AeroBLOX. All rights reserved.</p>
    </footer>

<!-- Supabase Core Library & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
