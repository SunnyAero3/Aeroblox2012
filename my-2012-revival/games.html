<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBLOX - Games</title>
    <link rel="stylesheet" href="css/style.css">

<body>
    <div class="top-nav">
        <h1>AeroBLOX</h1>
        <div class="nav-links">
            <a href="index.html">Home</a> | 
            <a href="games.html">Games</a> | 
            <a href="my-roblox.html">My Character</a> | 
            <a href="people.html">People</a>
        </div>
    </div>

    <div class="main-container">
        <h2>Active Games</h2>
        
        <!-- Empty grid where JavaScript will inject games -->
        <div class="games-grid" id="games-grid">
            <p>Loading servers from database...</p>
        </div>

        <!-- Hidden blueprint for a game card -->
        <template id="game-card-template">
            <div class="game-card">
                <div class="game-thumb"></div>
                <div class="game-title" data-field="title">Game Title</div>
                <div class="game-creator" data-field="creator">Host</div>
                <div class="player-count" data-field="players">0 / 12</div>
                <button class="btn-aero play-btn">Play</button>
            </div>
        </template>
    </div>

    <footer>
        <p>&copy; 2026 AeroBLOX. All rights reserved.</p>
    </footer>

    <!-- Supabase Core Library & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

</body>
</html>
