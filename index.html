<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroBLOX - Home</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container">
        <!-- Navigation Bar -->
        <div class="top-nav">
            <h1>AeroBLOX</h1>
            <div class="nav-links">
                <a href="index.html">My AeroBLOX</a> | 
                <a href="people.html">People</a>
            </div>
        </div>
        
        <!-- Login Module -->
        <div class="module-box">
            <div class="module-header">Member Login</div>
            <div class="module-content">
                
                <!-- Auth Forms (Container hidden automatically when logged in) -->
                <div id="auth-forms">
                    <label>Username:</label>
                    <input type="text" id="username-input">
                    
                    <label>Password:</label>
                    <input type="password" id="password-input">
                    
                    <button id="login-btn" class="btn-classic" onclick="loginUser()">Login</button>
                    <button id="register-btn" class="btn-classic" onclick="registerUser()">Register</button>
                </div>

                <!-- Logout Button (Hidden by default, shown when logged in) -->
                <button id="logout-btn" class="btn-classic" style="display: none;" onclick="logoutUser()">Logout</button>
                
                <!-- Status Message -->
                <p id="status-message" style="color: red; font-weight: bold; margin-top: 10px;"></p>
                
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
