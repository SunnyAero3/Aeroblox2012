<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroBLOX - My AeroBLOX</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Guard: Redirect to login.html if not logged in -->
    <script>
        if (!localStorage.getItem("aeroUser")) {
            window.location.href = "login.html";
        }
    </script>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container">
        
        <!-- Top Header Bar with User Info & Currency -->
        <div class="top-header-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; background: #f2f2f2; border-bottom: 1px solid #ccc; font-size: 12px;">
            <div id="user-greeting">
                <span id="top-username-display" style="font-weight: bold;">Loading...</span>
                <button id="logout-btn" class="btn-classic" style="margin-left: 10px;" onclick="logoutUser()">Logout</button>
            </div>
            
            <!-- Top Right Currency Counters -->
            <div id="currency-widget" style="display: flex; gap: 15px; align-items: center; font-weight: bold;">
                <span style="color: #008000; display: flex; align-items: center; gap: 4px;">
                    <span style="background: #008000; color: #fff; border-radius: 3px; padding: 1px 4px; font-size: 10px;">R$</span> 
                    <span id="top-robux-count">0</span>
                </span>
                <span style="color: #c68a00; display: flex; align-items: center; gap: 4px;">
                    <span style="background: #c68a00; color: #fff; border-radius: 3px; padding: 1px 4px; font-size: 10px;">T$</span> 
                    <span id="top-tickets-count">0</span>
                </span>
            </div>
        </div>

        <!-- Primary Main Navigation Bar -->
        <div class="top-nav">
            <h1>AeroBLOX</h1>
            <div class="nav-links">
                <a href="index.html" class="active">My AeroBLOX</a> | 
                <a href="#">Games</a> | 
                <a href="#">Catalog</a> | 
                <a href="people.html">People</a> | 
                <a href="#">Forum</a>
            </div>
        </div>

        <!-- Orange Sub-Menu Strip (My AeroBLOX Exclusive) -->
        <div class="sub-nav-bar" style="background: #e26b00; padding: 6px 12px; font-size: 11px; font-weight: bold; border-top: 1px solid #ff9d3b; border-bottom: 1px solid #b35400;">
            <a href="index.html" style="color: #ffffff; text-decoration: none; margin-right: 8px;">Home</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Places</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Inbox</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Account</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Profile</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Friends</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Character</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Stuff</a> |
            <a href="#" style="color: #ffffff; text-decoration: none; margin: 0 8px;">Money</a>
        </div>
        
        <!-- Main Dashboard Content -->
        <div class="dashboard-body" style="padding: 15px; display: flex; gap: 15px; align-items: flex-start;">
            
            <!-- Left Column: Avatar & Balance -->
            <div class="left-col" style="width: 220px; flex-shrink: 0;">
                <h2 id="greeting-header" style="font-size: 18px; color: #003366; margin-top: 0;">Hi...</h2>
                
                <div class="module-box" style="margin-bottom: 15px;">
                    <div class="module-content" style="text-align: center; background: #ffffff; padding: 10px;">
                        <div style="background: #e9e9e9; width: 160px; height: 180px; margin: 0 auto; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center;">
                            <p style="font-size: 11px; color: #777;">Avatar<br>Coming Soon</p>
                        </div>
                    </div>
                </div>

                <div class="module-box">
                    <div class="module-header">My Balance</div>
                    <div class="module-content" style="background: #fff; padding: 10px; font-size: 12px;">
                        <p style="margin: 4px 0; color: #008000; font-weight: bold;">R$ Robux: <span id="dash-robux">0</span></p>
                        <p style="margin: 4px 0; color: #c68a00; font-weight: bold;">T$ Tickets: <span id="dash-tickets">0</span></p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Status & Feed -->
            <div class="right-col" style="flex-grow: 1;">
                
                <div class="module-box" style="margin-bottom: 15px;">
                    <div class="module-header">Current Status</div>
                    <div class="module-content" style="background: #fff; padding: 12px;">
                        <p style="margin: 0 0 6px 0; font-size: 12px; font-weight: bold; color: #333;">Right now I'm:</p>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="status-input" placeholder="What are you up to?" style="flex-grow: 1; padding: 5px; border: 1px solid #7f9db9; font-size: 12px;">
                            <button id="update-status-btn" class="btn-classic" onclick="updateStatus()">Update Status</button>
                        </div>
                        <p id="status-update-msg" style="font-size: 11px; margin: 5px 0 0 0; color: green; font-weight: bold; display: none;"></p>
                    </div>
                </div>

                <div class="module-box">
                    <div class="module-header">My Feed</div>
                    <div class="module-content" style="background: #fff; padding: 15px;">
                        <div id="feed-container">
                            <p style="font-size: 12px; color: #666; margin: 0;">No status updates yet!</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/home.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
