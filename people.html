<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroBLOX - People</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container">
        <!-- Navigation Bar -->
        <div class="top-nav">
            <h1>AeroBLOX</h1>
            <div class="nav-links">
                <a href="index.html">My AeroBLOX</a> | 
                <a href="people.html">People</a>
            </div>
            <!-- Header Logout Button -->
            <button id="logout-btn" class="btn-classic" style="display: none; float: right; margin-top: -5px;" onclick="logoutUser()">Logout</button>
        </div>
        
        <!-- People List Module -->
        <div class="module-box">
            <div class="module-header">People on AeroBLOX</div>
            <div class="module-content">
                <!-- User cards will dynamically load here -->
                <div id="people-list">
                    <p style="text-align: center; font-weight: bold; padding: 20px; color: #555;">Loading users from database...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts (auth.js MUST load first so _supabase is ready) -->
    <script src="js/auth.js"></script>
    <script src="js/people.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
